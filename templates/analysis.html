<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analysis</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #eee;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .graph-box {
      background: white;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="navbar">
    <a href="{{ url_for('homepage') }}" class="button">Dashboard</a>
    <a href="{{ url_for('plant_log') }}" class="button">Plant Log</a>
    <a href="{{ url_for('analysis') }}" class="button">Analysis</a>
  </div>

  <h1>Analysis</h1>

  <div class="graph-box">
    {{ plot_div | safe }}
  </div>

<div class="graph-box">
    <h2>Recent growth:</h2>
    <video autoplay loop muted playsinline style="width: 100%; border-radius: 4px;">
      <source src="{{ url_for('static', filename='timelapse.mp4') }}" type="video/mp4">
    </video>
  </div>

</body>
</html>
